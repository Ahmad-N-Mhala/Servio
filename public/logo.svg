<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant orange gradient - more attractive than terracotta -->
    <linearGradient id="clocheGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8C42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    <!-- Clean white gradient for fork -->
    <linearGradient id="forkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8F9FA;stop-opacity:1" />
    </linearGradient>
    <!-- Soft shadow for depth -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Cloche dome (vibrant orange gradient) -->
  <path d="M 100 40 Q 100 30 90 30 L 60 30 Q 50 30 50 40 L 50 90 Q 50 100 60 100 L 90 100 Q 100 100 100 90 Z" 
        fill="url(#clocheGradient)" 
        filter="url(#shadow)"/>
  
  <!-- Cloche handle (rounded) -->
  <ellipse cx="100" cy="30" rx="8" ry="6" fill="url(#clocheGradient)"/>
  
  <!-- Fork (clean white) -->
  <g fill="url(#forkGradient)">
    <!-- Fork handle -->
    <rect x="95" y="100" width="10" height="50" rx="2"/>
    
    <!-- Fork tines (three prongs) -->
    <rect x="88" y="40" width="4" height="60" rx="2"/>
    <rect x="98" y="40" width="4" height="60" rx="2"/>
    <rect x="108" y="40" width="4" height="60" rx="2"/>
  </g>
  
  <!-- Base plate (subtle gray) -->
  <ellipse cx="100" cy="150" rx="45" ry="8" fill="#E8E8E8" opacity="0.5"/>
</svg>
