<svg width="300" height="120" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clocheGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8C42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="forkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8F9FA;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo Icon -->
  <g transform="translate(20, 20)">
    <!-- Cloche dome -->
    <path d="M 40 20 Q 40 15 35 15 L 20 15 Q 15 15 15 20 L 15 45 Q 15 50 20 50 L 35 50 Q 40 50 40 45 Z" 
          fill="url(#clocheGradient)" 
          filter="url(#shadow)"/>
    
    <!-- Cloche handle -->
    <ellipse cx="40" cy="15" rx="4" ry="3" fill="url(#clocheGradient)"/>
    
    <!-- Fork -->
    <g fill="url(#forkGradient)">
      <rect x="38" y="50" width="5" height="25" rx="1"/>
      <rect x="33" y="20" width="2" height="30" rx="1"/>
      <rect x="38" y="20" width="2" height="30" rx="1"/>
      <rect x="43" y="20" width="2" height="30" rx="1"/>
    </g>
    
    <!-- Base plate -->
    <ellipse cx="40" cy="75" rx="18" ry="3" fill="#E8E8E8" opacity="0.5"/>
  </g>
  
  <!-- Text: RestaurFy with accent color -->
  <text x="80" y="55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#1F2937" letter-spacing="-0.5">
    Restaur<tspan fill="#FF6B35">Fy</tspan>
  </text>
</svg>

