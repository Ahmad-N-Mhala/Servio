  </defs>
  
  <!-- Cloche dome -->
  <path d="M 32 12 Q 32 10 28 10 L 18 10 Q 16 10 16 12 L 16 28 Q 16 30 18 30 L 28 30 Q 32 30 32 28 Z" 
