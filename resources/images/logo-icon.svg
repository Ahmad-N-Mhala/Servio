  <ellipse cx="32" cy="10" rx="3" ry="2" fill="url(#clocheGradient)"/>
  
  <!-- Fork -->
  <g fill="url(#forkGradient)">
    <rect x="30" y="30" width="4" height="16" rx="1"/>
    <rect x="26" y="12" width="1.5" height="18" rx="0.5"/>
    <rect x="30" y="12" width="1.5" height="18" rx="0.5"/>
    <rect x="34" y="12" width="1.5" height="18" rx="0.5"/>
  </g>
  
  <!-- Base plate -->
  <ellipse cx="32" cy="48" rx="14" ry="2" fill="#E8E8E8" opacity="0.5"/>
